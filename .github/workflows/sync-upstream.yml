name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge official upstream
        id: sync
        run: bash .github/scripts/sync-upstream.sh

      - name: Push synchronized main
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Record result
        run: |
          {
            echo "### hbb_common upstream sync"
            echo "- Changed: ${{ steps.sync.outputs.changed }}"
            echo "- HEAD: \`${{ steps.sync.outputs.head }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
