name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify sync token
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::Repository secret UPSTREAM_SYNC_TOKEN is required for upstream pushes."
            exit 1
          fi

      - name: Checkout fork main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: false

      - name: Configure temporary Git credentials
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_header"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge official upstream
        id: sync
        run: bash .github/scripts/sync-upstream.sh

      - name: Push synchronized main
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Record result
        env:
          SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
          SYNC_HEAD: ${{ steps.sync.outputs.head }}
        run: |
          {
            echo "### hbb_common upstream sync"
            echo "- Changed: $SYNC_CHANGED"
            echo "- HEAD: \`$SYNC_HEAD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Git credentials
        if: always()
        run: git config --local --unset-all http.https://github.com/.extraheader || true
